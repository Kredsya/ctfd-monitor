name: test-and-build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build coverage
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: sudo apt-get update
      - run: sudo apt-get install -y tmux
      - run: python -m coverage run --branch --source=ctfd_monitor tests/run_suite.py
      - if: always()
        run: python tests/mutation_smoke.py
      - if: always()
        run: python -m coverage xml -o test-results/coverage.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.python }}
          path: test-results/

      - run: ctfd-monitor --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python }}
          path: dist/*
  stock-ctfd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=src python tests/stock_ctfd_smoke.py
  lab-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated CTFd lab and both monitor profiles
        run: python lab.py --scenario smoke --data "$RUNNER_TEMP/ctfd-lab-release" --port 18080 --koth-port 18081
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-evidence
          path: |
            ${{ runner.temp }}/ctfd-lab-release/*-monitor.log
            ${{ runner.temp }}/ctfd-lab-release/stock-responses.json
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, stock-ctfd, lab-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-3.12
          path: release
      - name: Verify tag matches product version
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          PY
      - name: Publish verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && sha256sum *.whl *.tar.gz > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "CTFd Monitor $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
