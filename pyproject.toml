[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctfd-monitor"
version = "0.3.3"
description = "Profile-driven CTFd challenge monitor and attachment downloader"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Kredsya"}]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.scripts]
ctfd-monitor = "ctfd_monitor.app:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctfd_monitor = ["*.sh"]
